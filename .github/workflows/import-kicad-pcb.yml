name: Import KiCad 9 rover control PCB

on:
  push:
    branches:
      - development/full-rover-simulation
    paths:
      - .pcb-import/READY

permissions:
  contents: write

jobs:
  import-pcb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development/full-rover-simulation
          fetch-depth: 0

      - name: Rebuild KiCad project from staged import
        shell: bash
        run: |
          set -euo pipefail
          TARGET="hardware/rover_control_pcb"
          TMP="/tmp/pcb-import"
          mkdir -p "$TMP"

          cat .pcb-import/small.* | tr -d '\n\r' | base64 -d > "$TMP/small.tar.gz"
          cat .pcb-import/board.* | tr -d '\n\r' | base64 -d > "$TMP/board.kicad_pcb.gz"
          cat .pcb-import/step.* | tr -d '\n\r' | base64 -d > "$TMP/esp32.step.gz"
          cat .pcb-import/render3d.* | tr -d '\n\r' | base64 -d > "$TMP/NASA_LUNABOTICS_PCB.png"
          cat .pcb-import/rendertop.* | tr -d '\n\r' | base64 -d > "$TMP/NASA_LUNABOTICS_TOP.png"

          rm -rf "$TARGET"
          mkdir -p "$TARGET"
          tar -xzf "$TMP/small.tar.gz" -C "$TARGET"

          mkdir -p "$TARGET/3dmodels" "$TARGET/images" "$TARGET/artwork"
          gzip -dc "$TMP/board.kicad_pcb.gz" > "$TARGET/Lunar_Hawks_Rover_Control.kicad_pcb"
          gzip -dc "$TMP/esp32.step.gz" > "$TARGET/3dmodels/ESP32-WROOM-32E.step"
          cp "$TMP/NASA_LUNABOTICS_PCB.png" "$TARGET/images/NASA_LUNABOTICS_PCB.png"
          cp "$TMP/NASA_LUNABOTICS_TOP.png" "$TARGET/images/NASA_LUNABOTICS_TOP.png"
          cp media/UHCL_Lunabotics_Logo.jfif "$TARGET/artwork/UHCL_Lunabotics_Logo.jfif"

          cd "$TARGET"
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cd - >/dev/null

          rm -rf .pcb-import
          rm -f .github/workflows/import-kicad-pcb.yml

          git config user.name "Matthew Garcia"
          git config user.email "127278603+Matthew-Garcia@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Replace rover control PCB with KiCad 9.0 project"
          git push origin HEAD:development/full-rover-simulation
